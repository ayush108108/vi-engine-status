# Upptime config for https://github.com/ayush108108/vi-engine-status (copy this file to the repo root as .upptimerc.yml)
owner: ayush108108
repo: vi-engine-status

sites:
  - name: VI Engine app
    url: https://app.viengine.social
  - name: VI Engine backend (API health)
    url: https://api.viengine.social/health
  - name: VI Engine website
    url: https://viengine.social

# Checks run every 5 minutes. GitHub may delay scheduled runs by a few minutes at busy times.
workflowSchedule:
  uptime: "*/5 * * * *"

assignees:
  - ayush108108

status-website:
  cname: status.viengine.social
  name: VI Engine Status
  logoUrl: https://viengine.social/favicon.ico
  introTitle: "VI Engine service status"
  introMessage: "Live status of the VI Engine app, backend and website. If something is down, we are already on it."
  navbar:
    - title: Status
      href: /
    - title: VI Engine
      href: https://viengine.social

commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci]"
  summaryJob: ":card_file_box: Update status summary [skip ci]"
  statusChange: "{{ emoji }} {{ site.name }} is {{ status }}"
